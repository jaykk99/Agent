services:
  - type: web
    name: jarvis-agent
    runtime: node
    plan: free
    buildCommand: cd web && npm install && npm run build
    startCommand: cd web && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Keyless-first: the app runs without any of the above (chat falls back
      # to the free keyless provider; integrations simply stay off).
